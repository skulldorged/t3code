name: Personal release

on:
  push:
    tags:
      - "personal-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact release version"
        required: true
        type: string
      expected_sha:
        description: "Exact integration commit expected by the updater"
        required: false
        type: string
      source_manifest:
        description: "JSON with mainSha and exact overlay heads"
        required: false
        type: string
      draft:
        description: "Build a draft release without updating the production feed"
        required: false
        default: false
        type: boolean
      ios_runner:
        description: "Where the iOS app builds: canis, or GitHub's macOS runner if canis is down"
        required: false
        default: canis-ios
        type: choice
        options:
          - canis-ios
          - macos-26

permissions:
  contents: read

env:
  T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
  T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
  T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
  T3CODE_DESKTOP_UPDATE_REPOSITORY: skulldorged/t3code

jobs:
  metadata:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and record release sources
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_MANIFEST: ${{ inputs.source_manifest }}
        run: node scripts/personal-release-sources.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: personal-sources
          path: release-provenance/*
          if-no-files-found: error
      - id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#personal-v}"
          else
            version="${DISPATCH_VERSION#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    needs: metadata
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Stamp version
        run: node scripts/update-release-package-versions.ts "${{ needs.metadata.outputs.version }}"
      - name: Typecheck changed packages
        env:
          GOMEMLIMIT: 4GiB
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const web = path.resolve("apps/web");
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "t3-web-tsconfig.json"), JSON.stringify({
            extends: path.join(web, "tsconfig.json"),
            compilerOptions: { incremental: false, composite: false, typeRoots: [path.join(web, "node_modules/@types"), path.resolve("node_modules/@types")] },
            include: [path.join(web, "src/**/*.ts"), path.join(web, "src/**/*.tsx"), path.join(web, "vite/**/*.ts"), path.join(web, "vite.config.ts"), path.join(web, "vercel.ts")],
            exclude: [path.join(web, "node_modules"), ...[web, path.resolve("scripts/lib")].flatMap((root) => ["**/*.test.*", "**/*.spec.*", "**/*.testkit.*", "**/test-fixtures.*", "**/*TestFixtures*", "**/*.test-support.*", "**/test/**", "**/testkit/**"].map((pattern) => path.join(root, pattern)))],
          }));
          const server = path.resolve("apps/server");
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "t3-server-tsconfig.json"), JSON.stringify({
            extends: path.join(server, "tsconfig.json"),
            compilerOptions: { typeRoots: [path.join(server, "node_modules/@types"), path.resolve("node_modules/@types")] },
            include: [path.join(server, "src/**/*.ts"), path.join(server, "vite.config.ts"), path.join(server, "scripts/**/*.ts"), path.resolve("scripts/lib/**/*.ts")],
            exclude: [path.join(server, "node_modules"), ...[server, path.resolve("scripts/lib")].flatMap((root) => ["**/*.test.*", "**/*.spec.*", "**/test-fixtures.*", "**/*TestFixtures*", "**/*.test-support.*", "**/test/**", "**/testkit/**"].map((pattern) => path.join(root, pattern)))],
          }));
          const mobile = path.resolve("apps/mobile");
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "t3-mobile-tsconfig.json"), JSON.stringify({
            extends: path.join(mobile, "tsconfig.json"),
            compilerOptions: { types: ["node", "react", "react-dom"], typeRoots: [path.join(mobile, "node_modules/@types"), path.resolve("node_modules/@types")] },
            include: [path.join(mobile, "**/*.ts"), path.join(mobile, "**/*.tsx")],
            exclude: [path.join(mobile, "node_modules"), path.join(mobile, "**/*.test.*"), path.join(mobile, "**/*.spec.*"), path.join(mobile, "**/test-fixtures.*"), path.join(mobile, "**/*.test-support.*")],
          }));
          NODE
          vp exec tsc --noEmit --project "$RUNNER_TEMP/t3-web-tsconfig.json"
          vp exec tsc --noEmit --project "$RUNNER_TEMP/t3-server-tsconfig.json"
          vp exec tsc --noEmit --project "$RUNNER_TEMP/t3-mobile-tsconfig.json"

  # Builds the server (with the web client) and the Electron main once; the
  # platform jobs package it instead of each rebuilding it.
  build_bundle:
    needs: metadata
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - name: Stamp version
        run: node scripts/update-release-package-versions.ts "${{ needs.metadata.outputs.version }}"
      - uses: ./.github/actions/setup-apt-mirrors
      # @t3tools/desktop#build compiles the Linux browser secret helper.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Build JS bundle
        run: vp run build:desktop
      - name: Pack server
        run: |
          mkdir -p release-publish
          node scripts/pack-server-artifact.ts "${{ needs.metadata.outputs.version }}" release-publish
      # The artifact root is apps/, so consumers download it into apps.
      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: release-publish/*
          if-no-files-found: error

  # One job per platform builds its CLI archive and, where there is one, its
  # desktop package. Windows embeds the Linux x64 archive as its WSL runtime
  # and waits for it partway through rather than for the whole Linux job.
  platform:
    name: Build ${{ matrix.label }}
    needs: [metadata, build_bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            platform: linux
            arch: x64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
            cli_archive: true
            desktop_target: AppImage
          - label: Linux arm64
            platform: linux
            arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
            cli_archive: true
          - label: macOS arm64
            platform: mac
            arch: arm64
            runner: macos-26
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
            cli_archive: true
          # Node's standalone executable crashes on Intel macOS; upstream
          # ships the Electron desktop app for this architecture instead.
          - label: macOS x64
            platform: mac
            arch: x64
            runner: macos-26-intel
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
            cli_archive: false
            desktop_target: dmg
          - label: Windows x64
            platform: win
            arch: x64
            runner: blacksmith-4vcpu-windows-2025
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
            cli_archive: true
            desktop_target: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.platform == 'win' && 60 || 45 }}
    permissions:
      # Windows reads this run's artifact list to wait for the Linux archive.
      actions: read
      contents: read
    env:
      BINARY_SUFFIX: ${{ matrix.platform == 'win' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      # On Windows linking the packages takes the time, not downloading them,
      # so upstream found restoring the package cache doesn't pay for itself.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false
      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor${{ env.BINARY_SUFFIX }}
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}
      - name: Cache Linux capture helpers
        if: matrix.platform == 'linux' && matrix.desktop_target
        id: capture_helper_cache
        uses: actions/cache@v6
        with:
          path: |
            native/kde-snap-shot/target/${{ matrix.rust_target }}/release/t3-kde-snap-shot
            native/hyprland-snap-shot/target/${{ matrix.rust_target }}/release/t3-hyprland-snap-shot
          key: linux-capture-helpers-${{ matrix.rust_target }}-${{ hashFiles('native/kde-snap-shot/Cargo.lock', 'native/kde-snap-shot/Cargo.toml', 'native/kde-snap-shot/src/**', 'native/hyprland-snap-shot/Cargo.lock', 'native/hyprland-snap-shot/Cargo.toml', 'native/hyprland-snap-shot/src/**', 'native/hyprland-snap-shot/protocols/**') }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true' || (matrix.platform == 'linux' && matrix.desktop_target && steps.capture_helper_cache.outputs.cache-hit != 'true')
        with:
          targets: ${{ matrix.rust_target }}
      # Building it here also lets the desktop build skip its MSVC check: the
      # Blacksmith Windows image lacks the Spectre libraries that check wants,
      # and cargo doesn't need them.
      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"
      - name: Stamp version
        run: node scripts/update-release-package-versions.ts "${{ needs.metadata.outputs.version }}"
      - uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps
      - name: Build CLI single-executable
        if: matrix.cli_archive
        env:
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose
      - name: Package CLI archive
        if: matrix.cli_archive
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor$BINARY_SUFFIX" "$target_dir/"
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" \
            --version "${{ needs.metadata.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli
      - uses: actions/upload-artifact@v7
        if: matrix.cli_archive
        with:
          name: cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-cli/*
          if-no-files-found: error
      - uses: ./.github/actions/setup-apt-mirrors
        if: matrix.platform == 'linux' && matrix.desktop_target
      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux' && matrix.desktop_target
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libsecret-1-dev pkg-config
      # Stops early if the Linux job ended without uploading the archive.
      - name: Wait for Linux CLI archive
        if: matrix.platform == 'win'
        shell: pwsh
        timeout-minutes: 40
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT: cli-linux-x64
          LINUX_JOB: Build Linux x64
        run: |
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $run = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          function Test-Archive {
            (Invoke-RestMethod -Headers $headers -Uri "$run/artifacts?name=$env:ARTIFACT").total_count -gt 0
          }
          $missingSince = $null
          while ($true) {
            try {
              if (Test-Archive) {
                Write-Host "$env:ARTIFACT is ready."
                exit 0
              }
              $jobs = Invoke-RestMethod -Headers $headers -Uri "$run/attempts/$env:GITHUB_RUN_ATTEMPT/jobs?per_page=100"
              $linux = $jobs.jobs | Where-Object { $_.name.EndsWith($env:LINUX_JOB) } | Select-Object -First 1
              if (-not $linux) {
                if (-not $missingSince) {
                  $missingSince = Get-Date
                } elseif (((Get-Date) - $missingSince).TotalMinutes -ge 5) {
                  Write-Host "::error::No job named '$env:LINUX_JOB' in this run, so $env:ARTIFACT will not arrive."
                  exit 1
                }
              } elseif ($linux.conclusion) {
                if (Test-Archive) {
                  Write-Host "$env:ARTIFACT is ready."
                  exit 0
                }
                Write-Host "::error::$env:LINUX_JOB ended ($($linux.conclusion)) without uploading $env:ARTIFACT."
                exit 1
              }
            } catch {
              Write-Warning "Could not read this run's artifacts or jobs: $($_.Exception.Message)"
            }
            Write-Host "Waiting for $env:ARTIFACT..."
            Start-Sleep -Seconds 10
          }
      - name: Download WSL runtime
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v8
        with:
          name: cli-linux-x64
          path: wsl-runtime
      - name: Import project macOS signing identity
        if: matrix.platform == 'mac' && matrix.desktop_target
        shell: bash
        env:
          PROJECT_P12: ${{ secrets.T3_MACOS_SELF_SIGN_P12 }}
          PROJECT_PASSWORD: ${{ secrets.T3_MACOS_SELF_SIGN_PASSWORD }}
          PROJECT_SHA1: ${{ secrets.T3_MACOS_SELF_SIGN_SHA1 }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$PROJECT_P12" && -n "$PROJECT_PASSWORD" && "$PROJECT_SHA1" =~ ^[0-9A-F]{40}$ ]] || {
            echo "Project signing secrets are missing or invalid." >&2
            exit 1
          }
          signing_dir="$RUNNER_TEMP/t3-project-signing"
          mkdir "$signing_dir"
          printf '%s' "$PROJECT_P12" | base64 --decode > "$signing_dir/identity.p12"
          /usr/bin/openssl pkcs12 -in "$signing_dir/identity.p12" \
            -passin env:PROJECT_PASSWORD -clcerts -nokeys -out "$signing_dir/certificate.pem"
          fingerprint="$(/usr/bin/openssl x509 -in "$signing_dir/certificate.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          subject="$(/usr/bin/openssl x509 -in "$signing_dir/certificate.pem" -noout -subject -nameopt RFC2253 | sed 's/^subject= */subject=/')"
          [[ "$fingerprint" == "$PROJECT_SHA1" && "$subject" == 'subject=O=T3 Code Personal,CN=T3 Code Personal' ]] || {
            echo "Signing certificate does not match the project identity." >&2
            exit 1
          }
          keychain="$signing_dir/identity.keychain-db"
          security create-keychain -p "$PROJECT_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$PROJECT_PASSWORD" "$keychain"
          security import "$signing_dir/identity.p12" -k "$keychain" \
            -P "$PROJECT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PROJECT_PASSWORD" "$keychain" > /dev/null
          # codesign only selects valid identities. Trust this self-signed
          # certificate for code signing on the disposable runner, not on recipients.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k "$keychain" "$signing_dir/certificate.pem"
          identities="$(security find-identity -v -p codesigning "$keychain")"
          [[ "$identities" == *"$PROJECT_SHA1"* ]] || {
            echo "The imported project certificate is not a valid signing identity." >&2
            exit 1
          }
          echo "T3CODE_MACOS_SELF_SIGN_IDENTITY=$PROJECT_SHA1" >> "$GITHUB_ENV"
          echo "T3CODE_MACOS_SELF_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build desktop package
        if: matrix.desktop_target
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          T3CODE_DESKTOP_REUSE_LINUX_CAPTURE_HELPERS: ${{ steps.capture_helper_cache.outputs.cache-hit == 'true' }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.desktop_target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.metadata.outputs.version }}"
            --skip-build
            --verbose
          )
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz)
          fi
          vp run dist:desktop:artifact "${args[@]}"
      - name: Inspect project-signed macOS app
        if: matrix.platform == 'mac' && matrix.desktop_target
        shell: bash
        run: |
          set -euo pipefail
          archive=(release/T3-Code-*-${{ matrix.arch }}.zip)
          [[ "${#archive[@]}" == 1 && -f "${archive[0]}" ]]
          inspection="$RUNNER_TEMP/t3-project-signing/inspection"
          mkdir "$inspection"
          ditto -x -k "${archive[0]}" "$inspection"
          app=("$inspection/"*.app)
          [[ "${#app[@]}" == 1 && -d "${app[0]}" ]]
          codesign --verify --deep --strict --verbose=2 "${app[0]}"
          codesign -d -r- "${app[0]}"
          codesign -d --extract-certificates "$RUNNER_TEMP/t3-project-signing/built-cert-" "${app[0]}"
          fingerprint="$(/usr/bin/openssl x509 -inform DER \
            -in "$RUNNER_TEMP/t3-project-signing/built-cert-0" \
            -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          [[ "$fingerprint" == "$T3CODE_MACOS_SELF_SIGN_IDENTITY" ]]
      - name: Remove temporary project signing keychain
        if: always() && matrix.platform == 'mac' && matrix.desktop_target
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/t3-project-signing/identity.keychain-db"
          cleanup_status=0
          certificate="$RUNNER_TEMP/t3-project-signing/certificate.pem"
          if [[ -f "$certificate" ]]; then
            sudo security remove-trusted-cert -d "$certificate" || cleanup_status=$?
          fi
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain" || cleanup_status=$?
          fi
          python3 - <<'PY'
          import pathlib, shutil, os
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "t3-project-signing"
          if directory.exists():
              shutil.rmtree(directory)
          PY
          exit "$cleanup_status"
      - name: Collect desktop artifacts
        if: matrix.desktop_target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          find release -maxdepth 1 -type f \( \
            -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o \
            -name '*.blockmap' -o -name '*.yml' \
          \) -exec cp {} release-publish/ \;
      - uses: actions/upload-artifact@v7
        if: matrix.desktop_target
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  android:
    needs: metadata
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    # With ccache's defaults every compile missed (0 of 114). These keep build
    # directories, compiler timestamps and include-file times out of its hash.
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android compiler cache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ccache
      - name: Restore Android compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: android-ccache-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            android-ccache-v2-${{ runner.os }}-
      - name: Configure Android compiler cache
        shell: bash
        run: |
          set -euo pipefail
          command -v ccache
          ccache --max-size=2G
          ccache --zero-stats
      - name: Stamp release versions
        run: node scripts/update-release-package-versions.ts "${{ needs.metadata.outputs.version }}"
      - name: Build preview APK
        shell: bash
        env:
          APP_VARIANT: preview
          EXPO_NO_GIT_STATUS: "1"
        run: |
          set -euo pipefail
          export T3CODE_MOBILE_VERSION="${{ needs.metadata.outputs.version }}"
          export T3CODE_ANDROID_VERSION_CODE="$GITHUB_RUN_NUMBER"
          vp exec --filter @t3tools/mobile -- expo prebuild --clean --platform android
          ( cd apps/mobile/android && \
            ./gradlew --build-cache --parallel \
              -PreactNativeArchitectures=arm64-v8a \
              assembleRelease )
          ccache --show-stats
          mkdir -p release-publish
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "release-publish/T3-Code-${{ needs.metadata.outputs.version }}-preview.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: release-publish/*
          if-no-files-found: error

  # Mars's MacBook (canis) keeps its Xcode caches between builds; there a
  # warm archive took about 2 minutes, against 8 to 11 on GitHub's runner.
  ios:
    needs: metadata
    runs-on: ${{ inputs.ios_runner || 'canis-ios' }}
    timeout-minutes: 60
    env:
      ON_CANIS: ${{ (inputs.ios_runner || 'canis-ios') == 'canis-ios' }}
      APP_VARIANT: preview
      EXPO_NO_GIT_STATUS: "1"
      T3CODE_IOS_VERSION: 1.2.${{ github.run_number }}
      T3CODE_IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      # canis checks out each run at a new path, and Xcode names a workspace's
      # DerivedData folder (T3Code, T3CodePreview, ...) after its path, so
      # earlier runs' folders are never reused. Clear them first, before
      # checkout and install need the room; the shared compilation and module
      # caches stay.
      - name: Clear earlier iOS build folders
        if: env.ON_CANIS == 'true'
        shell: bash
        run: |
          derived_data="$HOME/Library/Developer/Xcode/DerivedData"
          [[ -d "$derived_data" ]] || exit 0
          find "$derived_data" -mindepth 1 -maxdepth 1 -name 'T3Code*-*' -exec rm -rf {} +
      - uses: actions/checkout@v6
      # canis keeps its package store, so restoring and saving one costs more
      # than it saves there.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ env.ON_CANIS != 'true' }}
          run-install: true
      - name: Select Xcode
        id: xcode
        run: |
          if [[ "$ON_CANIS" == "true" ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          else
            sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version
          echo "build=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      # canis keeps these on disk between builds.
      - name: Restore iOS native caches
        if: env.ON_CANIS != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            ~/Library/Caches/CocoaPods
            ~/.cache/t3-ios-source-packages
          key: ios-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ios-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-
      - name: Generate iOS project
        run: vp exec --filter @t3tools/mobile -- expo prebuild --clean --platform ios
      - name: Archive unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          workspace=(apps/mobile/ios/*.xcworkspace)
          scheme="$(basename "${workspace[0]}" .xcworkspace)"
          xcodebuild archive \
            -workspace "${workspace[0]}" -scheme "$scheme" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/T3Code.xcarchive" \
            -clonedSourcePackagesDirPath "$HOME/.cache/t3-ios-source-packages" \
            -showBuildTimingSummary \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            COMPILATION_CACHE_CAS_PATH="$HOME/Library/Developer/Xcode/DerivedData/CompilationCache.noindex" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' \
            > "$RUNNER_TEMP/ios-build.log" 2>&1 || {
              tail -200 "$RUNNER_TEMP/ios-build.log"
              exit 1
            }
      - name: Record native cache size
        run: du -sh "$HOME/Library/Developer/Xcode/DerivedData/CompilationCache.noindex" "$HOME/.cache/t3-ios-source-packages" >> "$GITHUB_STEP_SUMMARY"
      - name: Package IPA and Feather repository
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 scripts/package-personal-ios.py "$RUNNER_TEMP/T3Code.xcarchive" release-publish
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: release-publish/*
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/ios-build.log

  release:
    needs: [metadata, validate, build_bundle, platform, android, ios]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: server
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: ios
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: personal-sources
          path: release-assets
      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          ( cd release-assets && sha256sum * > SHA256SUMS )
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: personal-v${{ needs.metadata.outputs.version }}
          name: T3 Code Personal ${{ needs.metadata.outputs.version }}
          generate_release_notes: true
          body_path: release-assets/personal-release-notes.md
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft == true }}
          prerelease: false
          make_latest: ${{ inputs.draft == true && 'false' || 'true' }}
          files: release-assets/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}
